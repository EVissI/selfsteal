# Selfsteal-заглушка для Reality: nginx слушает 127.0.0.1:${NGINX_PORT},
# Xray (Reality) на :443 пересылает туда нераспознанный трафик.
# Сертификат выпускается Let's Encrypt через HTTP-01 (нужен доступный порт 80),
# без Cloudflare-токена и без wildcard — только на SNI_HOST.
services:
  # Первичный выпуск: standalone на порту 80 (nginx ещё не поднят).
  certbot-init:
    image: certbot/certbot:latest
    network_mode: host
    restart: "no"
    env_file: .env
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f "/etc/letsencrypt/live/$$SNI_HOST/fullchain.pem" ]; then
          certbot certonly --standalone --http-01-port 80 \
            --non-interactive --agree-tos -m "$$LE_EMAIL" \
            --cert-name "$$SNI_HOST" -d "$$SNI_HOST"
        fi

  # Продление: webroot, пока nginx держит порт 80 (без конфликта за порт).
  # --keep-until-expiring = no-op, пока серт не близок к истечению.
  certbot-renew:
    image: certbot/certbot:latest
    network_mode: host
    restart: unless-stopped
    env_file: .env
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          sleep 12h
          certbot certonly --webroot -w /var/www/certbot \
            --non-interactive --agree-tos -m "$$LE_EMAIL" \
            --keep-until-expiring --cert-name "$$SNI_HOST" -d "$$SNI_HOST" || true
        done

  nginx:
    image: nginx:stable-alpine
    network_mode: host          # чтобы Xray на хосте видел 127.0.0.1:${NGINX_PORT}
    restart: unless-stopped
    env_file: .env
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./sites:/usr/share/nginx/html:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    # Выбираем каталог сайта по SITE_INDEX (1|2|...|random), экспортируем SITE_DIR
    # для envsubst, затем отдаём управление штатному entrypoint nginx (первый
    # аргумент — nginx, поэтому подстановка шаблонов отрабатывает штатно).
    # Фоном раз в сутки перечитываем сертификат после возможного обновления.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        html=/usr/share/nginx/html
        if [ "$$SITE_INDEX" = "random" ]; then
          n=$$(ls -d $$html/*/ 2>/dev/null | wc -l)
          [ "$$n" -gt 0 ] || { echo "selfsteal: no sites found in $$html" >&2; exit 1; }
          r=$$(( $$(od -An -N2 -tu2 /dev/urandom) % n + 1 ))
          SITE_DIR=$$(ls -d $$html/*/ | sed -n "$${r}p" | xargs -n1 basename)
        else
          SITE_DIR=$$SITE_INDEX
        fi
        if [ ! -f "$$html/$$SITE_DIR/index.html" ]; then
          echo "selfsteal: site '$$SITE_DIR' not found in $$html" >&2; exit 1
        fi
        export SITE_DIR
        echo "selfsteal: serving site '$$SITE_DIR' (SITE_INDEX=$$SITE_INDEX)"
        (while :; do sleep 24h; nginx -s reload; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
